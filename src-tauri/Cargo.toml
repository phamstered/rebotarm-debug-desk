[package]
name = "easy-debug"
version = "0.1.0"
description = "ROS 2 robot debugging workstation"
authors = ["Robot Console contributors"]
edition = "2021"

[lib]
name = "easy_debug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "process", "time", "macros", "sync"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
tauri = { version = "2", features = ["test", "unstable"] }

[patch.crates-io]
tauri = { path = "vendor/tauri" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
