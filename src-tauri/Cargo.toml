[package]
name = "easy-debug"
version = "0.1.0"
description = "ROS 2 robot debugging workstation"
authors = ["Robot Console contributors"]
edition = "2021"

[lib]
name = "easy_debug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "process", "time", "macros", "sync"] }
