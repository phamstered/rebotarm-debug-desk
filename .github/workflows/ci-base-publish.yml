# Build and push the desk CI base image to GHCR.
# Desk-only — stack/executor own their own images.
name: Publish CI base image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docker/ci-base/**"
      - ".github/workflows/ci-base-publish.yml"
  pull_request:
    paths:
      - "docker/ci-base/**"
      - ".github/workflows/ci-base-publish.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: phamstered/rebotarm-debug-desk/ci-base

jobs:
  build-and-push:
    name: Build and push ci-base
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      date_tag: ${{ steps.meta.outputs.date_tag }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Should push image
        id: push_gate
        shell: bash
        run: |
          set -euo pipefail
          PUSH=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            PUSH=true
          elif [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            # Same-repo PR (incl. draft): allow GHCR push so CI can adopt the image
            # before merge. Forks stay build-only.
            PUSH=true
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.push_gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag suffixes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          DATE_TAG="node22-$(date -u +%Y%m%d)"
          SHA_TAG="node22-$(echo -n "${GITHUB_SHA}" | cut -c1-7)"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.date_tag }}
            type=raw,value=${{ steps.meta.outputs.sha_tag }}
            type=raw,value=node22

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci-base/Dockerfile
          push: ${{ steps.push_gate.outputs.push == 'true' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        if: steps.push_gate.outputs.push == 'true'
        shell: bash
        run: |
          {
            echo "## CI base image pushed"
            echo ""
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- Tags: \`${{ steps.meta.outputs.date_tag }}\`, \`${{ steps.meta.outputs.sha_tag }}\`, \`node22\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin \`.github/workflows/ci.yml\` with:"
            echo "\`\`\`yaml"
            echo "image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
