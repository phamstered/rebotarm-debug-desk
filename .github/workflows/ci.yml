# Robot Console CI — runs what GitHub-hosted runners can exercise.
# Replaces the old rust.yml that ran `cargo` at the repo root (no Cargo.toml there).
#
# Covered (matches package.json entry points on this branch):
#   - Frontend Vitest + TypeScript/Vite build
#   - Tauri/Rust unit tests via `cargo test --manifest-path src-tauri/Cargo.toml`
#   - Bridge core C++ unit tests (`npm run test:bridge`) — pure headers, NO ROS 2
#
# NOT covered here (needs Jetson / ROS 2 Humble; see AGENTS.md):
#   - Bridge `colcon build` / `colcon test` / live ROS topic integration
#
# Toolchain (Node 22 / npm 10, Rust stable, Tauri apt deps) lives in the
# desk CI base image — see docker/ci-base/. Stack/executor have their own images.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Frontend + Rust + Bridge core
    runs-on: ubuntu-22.04
    # --user root: GHA container jobs need a writable HOME for npm/cargo caches.
    container:
      # Pinned digest from Publish CI base image run (tags also exist:
      # node22, node22-20261027, node22-affea75). Bump when rebuilding the image.
      image: ghcr.io/phamstered/rebotarm-debug-desk/ci-base@sha256:f1d0f05eeaf488f58daedb030248d68b2ebc7daa562840e565434574116e60a6
      options: --user root
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node/Rust/apt already in the image — no setup-node / rust-toolchain / apt-get.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Container HOME may differ from runner; keep cache keys stable.
          shared-key: desk-ci-base

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Frontend TypeScript / Vite build
        run: npm run build

      - name: Rust / Tauri unit tests
        run: npm run test:rust

      # Pure C++ unit binary against bridge_core.hpp — no rclcpp/ament/colcon.
      # Full Bridge ROS integration stays on Jetson (AGENTS.md §5 / §4).
      - name: Bridge core C++ unit tests (no ROS)
        run: npm run test:bridge

      - name: Motion recorder offline analysis tests (no ROS)
        run: npm run test:motion
